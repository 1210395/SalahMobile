name: amarati
description: "عمارتي — إدارة المباني السكنية والتجارية. Building & commercial-complex management app (Arabic, RTL)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Exact icon rendering from the original SVG path data.
  flutter_svg: ^2.0.10+1
  # Cairo type family (matches the prototype's Google Fonts import).
  google_fonts: ^6.2.1
  # HTTP client for the Laravel API.
  dio: ^5.7.0
  # Persist the auth token across launches.
  shared_preferences: ^2.3.2
  # Real spreadsheet export (pure Dart, no native code).
  excel: ^4.0.6
  # Share the generated report file (xlsx / csv).
  share_plus: ^10.1.4
  # Temp dir for the generated file before sharing.
  path_provider: ^2.1.4
  # Real PDF report export (with an Arabic-capable font via printing).
  pdf: ^3.11.1
  printing: ^5.13.3
  # Pick a logo image for the brand-editing panel.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logo-light.png
